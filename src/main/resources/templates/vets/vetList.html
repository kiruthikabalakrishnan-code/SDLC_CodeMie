<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'vets')}">

<body>

  <h2 th:text="#{vets}">Veterinarians</h2>

  <form id="vetFilterForm" th:action="@{/vets.html}" method="get" class="form-inline" style="margin-bottom: 15px">
    <div class="form-group">
      <label for="lastName" th:text="#{lastName}">Last Name</label>
      <input type="text" class="form-control" id="lastName" name="lastName" maxlength="100"
        th:value="${lastName}" />
    </div>
    <div class="form-group">
      <label for="specialty" th:text="#{specialty}">Specialty</label>
      <select class="form-control" id="specialty" name="specialty">
        <option value="" th:text="#{allSpecialties}">All specialties</option>
        <option th:each="s : ${specialties}" th:value="${s.name}" th:text="${s.name}"
          th:selected="${#strings.equalsIgnoreCase(s.name, specialty)}">radiology</option>
      </select>
    </div>
    <button type="submit" class="btn btn-primary" th:text="#{filter}">Filter</button>
    <a id="clearFilters" class="btn btn-default" th:href="@{/vets.html}" th:text="#{clear}">Clear</a>
  </form>

  <table id="vets" class="table table-striped">
    <thead>
      <tr>
        <th th:text="#{name}">Name</th>
        <th th:text="#{specialties}">Specialties</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="vet : ${listVets}">
        <td th:text="${vet.firstName + ' ' + vet.lastName}"></td>
        <td>
          <span th:each="specialty : ${vet.specialties}" th:text="${specialty.name + ' '}" /> <span
            th:if="${vet.nrOfSpecialties == 0}" th:text="#{none}">none</span>
        </td>
      </tr>
    </tbody>
  </table>
  <p id="noVetsMessage" th:if="${noResults}" th:text="#{noVetsMatchFilters}">No vets match the current filters.</p>
  <div th:if="${totalPages > 1}">
    <span th:text="#{pages}">Pages:</span>
    <span>[</span>
    <span th:each="i: ${#numbers.sequence(1, totalPages)}">
      <a th:if="${currentPage != i}" th:href="@{'/vets.html?page=__${i}__' + ${filterQuery}}">[[${i}]]</a>
      <span th:unless="${currentPage != i}">[[${i}]]</span>
    </span>
    <span>]&nbsp;</span>
    <span>
      <a th:if="${currentPage > 1}" th:href="@{'/vets.html?page=1' + ${filterQuery}}" th:title="#{first}"
        class="fa fa-fast-backward"></a>
      <span th:unless="${currentPage > 1}" th:title="#{first}" class="fa fa-fast-backward"></span>
    </span>
    <span>
      <a th:if="${currentPage > 1}" th:href="@{'/vets.html?page=__${currentPage - 1}__' + ${filterQuery}}" th:title="#{previous}"
        class="fa fa-step-backward"></a>
      <span th:unless="${currentPage > 1}" th:title="#{previous}" class="fa fa-step-backward"></span>
    </span>
    <span>
      <a th:if="${currentPage < totalPages}" th:href="@{'/vets.html?page=__${currentPage + 1}__' + ${filterQuery}}" th:title="#{next}"
        class="fa fa-step-forward"></a>
      <span th:unless="${currentPage < totalPages}" th:title="#{next}" class="fa fa-step-forward"></span>
    </span>
    <span>
      <a th:if="${currentPage < totalPages}" th:href="@{'/vets.html?page=__${totalPages}__' + ${filterQuery}}" th:title="#{last}"
        class="fa fa-fast-forward"></a>
      <span th:unless="${currentPage < totalPages}" th:title="#{last}" class="fa fa-fast-forward"></span>
    </span>
  </div>
</body>

</html>
